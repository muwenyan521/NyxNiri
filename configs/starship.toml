palette = "noctalia"
scan_timeout = 120

# Format Layout (Pawlette Standard Order: Who -> Where -> Git Context -> Proxy)
format = """\
[╭╴](fg:cyan)\
$os\
$username\
(\
    at \
    $directory\
)\
$git_branch\
$cmd_duration${custom.proxy}\
(\
    $python\
    $conda\
    $nodejs\
    $c\
    $rust\
    $java\
)
[╰─](fg:cyan)$character\
"""

# Enable blank line between commands
add_newline = true

[character]
success_symbol = "[󰍟](fg:cyan)"
error_symbol = "[󰍟](fg:red)"

[os]
format = "[$symbol]($style)"
style = "bold cyan"
disabled = false

[os.symbols]
Alpine = " "
Arch = " "
CachyOS = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
openSUSE = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "

[username]
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = true

[directory]
format = "[$path](bold fg:cyan)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:cyan"
read_only_style = "fg:coral"
before_repo_root_style = "fg:cyan"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

[time]
disabled = true

[cmd_duration]
disabled = false
format = "took [ $duration]($style) "
style = "bold fg:red"
min_time = 500

[git_branch]
format = "via [$symbol$branch]($style) "
style = "bold fg:cyan"
symbol = " "

[git_status]
disabled = false
format = "([$all_status$ahead_behind]($style) )"
style = "bold fg:yellow"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}${behind_count}"
up_to_date = ""
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"

[docker_context]
disabled = false
symbol = " "

[package]
disabled = false

[nodejs]
format = "[$symbol$version]($style) "
style = "bold fg:green"
symbol = " "
version_format = "${raw}"
disabled = false

[python]
disabled = false
format = '[${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style) '
symbol = " "
version_format = "${raw}"
style = "bold fg:yellow"

[conda]
format = "[$symbol$environment]($style) "
style = "bold fg:green"
ignore_base = false
disabled = false
symbol = " "

[java]
format = "[$symbol$version]($style) "
style = "bold fg:red"
version_format = "${raw}"
symbol = " "
disabled = false

[c]
format = "[$symbol($version(-$name))]($style) "
style = "bold fg:cyan"
symbol = " "
version_format = "${raw}"
disabled = false

[rust]
format = "[$symbol$version]($style) "
style = "bold fg:coral"
symbol = " "
version_format = "${raw}"
disabled = false

[custom.proxy]
command = "echo $http_proxy $all_proxy $HTTP_PROXY $ALL_PROXY | tr ' ' '\\n' | grep -v '^$' | head -n1 | sed -E 's|.*:||'"
when = "test -n \"$http_proxy\" -o -n \"$all_proxy\" -o -n \"$HTTP_PROXY\" -o -n \"$ALL_PROXY\""
style = "bold fg:yellow"
format = "[󰲝 $output]($style) "

