# ==============================================================================
# Kitty Custom Configuration / 用户 Kitty 私有配置
# ==============================================================================
# Any configuration options placed in this file will override standard settings
# and will be safely preserved across updates of the Nyxuri dotfiles.
# 
# 在此文件中添加的任何 Kitty 配置项都将覆盖默认设置，
# 并且在 Nyxuri 更新部署时会被完整保留，不会丢失。
#
# Examples / 基础配置示例:
# font_size 13.0
# background_opacity 0.85
# map ctrl+shift+t new_tab
#
# Advanced: Load all *__custom__*.conf files or files inside __custom__/ in order
# 高级：自动加载包含 *__custom__* 的配置文件或 __custom__/ 目录下的规则
# include glob:*__custom__*.conf
# include glob:__custom__/*.conf
# ==============================================================================

# Personal terminal additions. The managed kitty.conf keeps the upstream
# copy/paste contract; these settings are loaded after it and remain user-owned.
font_family Maple Mono NF CN
font_size 12.0
background_blur 20
enable_audio_bell no
copy_on_select clipboard
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+alt+t new_tab_with_cwd
map ctrl+alt+enter launch --location=vsplit --cwd=current
map ctrl+alt+shift+enter launch --location=hsplit --cwd=current
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
