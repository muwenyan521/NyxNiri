# ==============================================================================
# Kitty 主配置 — NyxNiri
# ==============================================================================
# 这个文件由仓库部署，更新时会被整个替换。
# 私人改动写 __custom__.conf（文件末尾 include，优先级最高）。
# 颜色由 Noctalia 写到 themes/noctalia.conf，随深浅色主题自动重生成。
# ==============================================================================

# ── 字体 ──────────────────────────────────────────────────────────────────────
font_family      Maple Mono NF CN
bold_font        Maple Mono NF CN Bold
italic_font      Maple Mono NF CN Italic
bold_italic_font Maple Mono NF CN Bold Italic
font_size        12.0

# font_features 认的是 PostScript 名，不是族名。
# +zero = 斜杠零（不想要斜杠就把这行删掉）。
font_features MapleMono-NF-CN-Regular +zero

# 中文和 Nerd 图标混排时默认行高偏挤，抬一点；cell_width 不要动。
modify_font cell_height 105%

# ── 外观 ──────────────────────────────────────────────────────────────────────
background_opacity        0.9
# 允许运行时用 Ctrl+Shift+A 调不透明度
dynamic_background_opacity yes
# 背景模糊需要合成器支持 ext-background-effect；niri 26.04 已实现。
# 换到不支持的合成器只是不生效，不会报错。
background_blur 20

hide_window_decorations yes
window_padding_width    6 8
placement_strategy      center

# ── 行为 ──────────────────────────────────────────────────────────────────────
remember_window_size    no
confirm_os_window_close 0
shell                    fish
# 光标形状由配置固定，不让 shell 集成改
shell_integration no-cursor

# 屏幕内滚 2 万行；翻页器另有 64 MB 独立缓冲。
scrollback_lines              20000
scrollback_pager_history_size 64
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# 滚动条只在往回滚时出现，平时不占视线。
scrollbar                   scrolled
scrollbar_width             0.6
scrollbar_radius            0.3
scrollbar_min_handle_height 2

# 响铃默认是开的，补全按 Tab 会一直响；只留标签页提示，不出声。
enable_audio_bell    no
window_alert_on_bell yes
bell_on_tab          "● "

# ── 光标 ──────────────────────────────────────────────────────────────────────
# 单位毫秒（原始值，未调过）。
cursor_trail 1
cursor_shape block

# ── 选择与链接 ────────────────────────────────────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
detect_urls            yes
show_hyperlink_targets yes
underline_hyperlinks   hover

# ── 标签栏 ────────────────────────────────────────────────────────────────────
# 两个以上标签才出现；powerline 斜切分隔，配 Maple 的 Nerd 图标正好。
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2
tab_bar_show_new_tab_button yes
# 标题带序号，配合下面的 Ctrl+Alt+数字 直接跳。
tab_title_template        "{index}: {title}{bell_symbol}{activity_symbol}"
active_tab_title_template "{index}: {title}"

# ── 键位：Windows 习惯 ────────────────────────────────────────────────────────
# 有选区就复制，没选区就把 Ctrl+C 原样交给程序，中断行为不变。
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# 整屏文本（含回滚）丢进剪贴板
map ctrl+a pipe @text clipboard sh -c "wl-copy 2>/dev/null || xclip -selection clipboard"

# 按词删除左右。fish 里 \e\x7f(Alt+Backspace)=backward-kill-word，
# 而 Ctrl+W 是 backward-kill-path-component（删整段路径），不是删词。
map ctrl+backspace send_text all \e\x7f
map ctrl+delete    send_text all \ed

# 字号：Ctrl+= / Ctrl+- / Ctrl+0
# 注：滚轮改字号在 kitty 0.49 做不到——mouse_map 只认 left/middle/right
# 三个按钮加 press/release/click 事件，scroll_up/scroll_down 不在可映射范围内，
# 写了也只会静默失效。所以滚轮留给滚动，字号只走键盘。
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

map ctrl+shift+s show_scrollback
map ctrl+shift+u kitten unicode_input

# ── 键位：分屏与标签 ──────────────────────────────────────────────────────────
# 新窗口/新标签继承当前目录（默认 new_window 不继承）。
map ctrl+shift+enter         new_window_with_cwd
map ctrl+alt+t               new_tab_with_cwd
map ctrl+alt+enter           launch --location=vsplit --cwd=current
map ctrl+alt+shift+enter     launch --location=hsplit --cwd=current

# 方向切窗 / 带窗搬家（Ctrl+Shift+方向键已被标签页占用）
map ctrl+alt+h       neighboring_window left
map ctrl+alt+l       neighboring_window right
map ctrl+alt+k       neighboring_window up
map ctrl+alt+j       neighboring_window down
map ctrl+alt+shift+h move_window left
map ctrl+alt+shift+l move_window right
map ctrl+alt+shift+k move_window up
map ctrl+alt+shift+j move_window down

# 堆叠布局：小屏或只想看一个窗口时
map ctrl+alt+z toggle_layout stack

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# 0.49 自带 Ctrl+Shift+P 前缀键（>p 路径、>n 跳 file:line、>h 超链接、>w 单词），
# 比单独绑一条 hints 顺手，所以这里不覆盖。

# ── 远程控制 ──────────────────────────────────────────────────────────────────
# 打开后 `kitty @ launch / get-text / focus-window` 才可用。
# 只监听 unix socket，不开 TCP：
# allow_remote_control socket-only
# listen_on unix:/tmp/kitty-{kitty_pid}

# ── 主题与私有配置 ────────────────────────────────────────────────────────────
# 用户私有配置挂载点（字体、键位、行为都写这里，随部署保留）。
include __custom__.conf

# 主题色：这一行由 Noctalia 在应用主题时自己写回文件末尾，
# 每次应用主题都会重排到最底，别手改位置。
# 副作用是颜色永远最后生效——所以别在 __custom__.conf 里改颜色，会被覆盖。
include themes/noctalia.conf
