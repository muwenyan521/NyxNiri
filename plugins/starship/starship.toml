"$schema" = 'https://starship.rs/config-schema.json'

format = """\
[](red)\
$os$username$hostname\
[](bg:peach fg:red)\
$directory$git_branch$git_status\
$docker_context$conda$c$rust$golang$nodejs$bun$php$java$kotlin$haskell$python\
[](bg:overlay2 fg:peach)\
$time\
[](fg:overlay2)\
$status$cmd_duration\
$line_break\
$character"""

palette = 'noctalia'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "bg:red fg:crust"
trim_at = "."

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:peach fg:red"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:peach fg:red"
format = '([ $all_status$ahead_behind ]($style))'
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}${behind_count}"
up_to_date = ""
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"

[nodejs]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[bun]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[c]
symbol = " "
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[rust]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[golang]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[php]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[java]
symbol = " "
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[kotlin]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[haskell]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version) ](fg:crust bg:peach)]($style)'

[python]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:peach)]($style)'

[docker_context]
symbol = ""
style = "bg:peach"
format = '[[ $symbol( $context) ](fg:crust bg:peach)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:peach"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:overlay2 fg:crust"
format = '[  $time ]($style)'

[line_break]
disabled = false

[status]
disabled = false
format = "[$symbol$status ]($style)"
symbol = "✖"
style = "bold fg:red"
map_symbol = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
disabled = false
style = "fg:overlay2"
format = "[  $duration ]($style)"
min_time = 500
show_notifications = false

